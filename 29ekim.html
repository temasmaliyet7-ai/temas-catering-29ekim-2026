<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>29 Ekim Cumhuriyet Bayramı – Temaş Catering</title>
<style>
:root{--w:min(90vw,640px);--d:1;--tx:49.56%;--ty:48.29%;--poly:polygon(0 0,100% 0,var(--tx) var(--ty));--lining:repeating-linear-gradient(135deg,#7d1520 0 7px,#6a0f1a 7px 14px);--gold:#e3c27a;--ink:#f6ecd9}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 45%,#5a1220 0,#2a0710 85%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:40px}
.env{position:relative;width:var(--w);aspect-ratio:16/9;perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:12px}
.env.done{cursor:default}
.env>*{position:absolute}
.back{inset:0;background:var(--lining);border-radius:4px;z-index:1;box-shadow:0 22px 34px rgba(0,0,0,.5)}
.front{inset:0;z-index:3;background:url(zarf_dis.png) 0 0/100% 100%;clip-path:polygon(0 0,var(--tx) var(--ty),100% 0,100% 100%,0 100%);border-radius:4px}
.crease{inset:0;z-index:3;filter:blur(3px);transition:opacity calc(.3s*var(--d))}
.crease i{position:absolute;inset:0;background:rgba(40,0,6,.45);clip-path:polygon(0 1%,var(--tx) calc(var(--ty) + 1.5%),100% 1%,100% 6%,var(--tx) calc(var(--ty) + 7%),0 6%)}
.flap{inset:0;z-index:4;transform-style:preserve-3d;transform-origin:50% 0;transition:transform calc(.9s*var(--d)) cubic-bezier(.5,0,.3,1)}
.flap b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:var(--poly)}
.flap .o{background:url(zarf_dis.png) 0 0/100% 100%}
.flap .i{background:var(--lining);transform:rotateX(180deg)}
.card{z-index:2;left:4%;bottom:4%;width:92%;aspect-ratio:16/9;perspective:1400px;transform-origin:center;transition:transform calc(1.1s*var(--d)) cubic-bezier(.25,.8,.25,1)}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform calc(.9s*var(--d)) cubic-bezier(.3,.7,.2,1);touch-action:pan-y;cursor:default}
.flip.drag{transition:none}
.done .flip{cursor:grab}
.face{position:absolute;inset:0;width:100%;height:100%;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;box-shadow:0 10px 28px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none;pointer-events:none}
.bk{transform:rotateY(180deg)}
.env.open .flap{transform:rotateX(180deg)}
.env.open .crease{opacity:0}
.env.low .flap{z-index:1}
.env.rise .card{transform:translateY(-60%)}
.env.out .card{z-index:8}
.env.out .back,.env.out .front,.env.out .flap{opacity:0;transition:opacity calc(.7s*var(--d))}
.hint{font-size:19px;letter-spacing:.02em;animation:pulse 2.2s ease-in-out infinite;transition:opacity .3s}
.hint.hide{opacity:0;animation:none}
.hint.err{max-width:320px;text-align:center;line-height:1.5;animation:none}
@keyframes pulse{50%{opacity:.45}}
.bar{position:fixed;left:0;right:0;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .6s,transform .6s}
.bar.show{opacity:1;transform:none;pointer-events:auto}
.tip{font-size:15px;opacity:.85}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 12px}
.btn{background:var(--gold);color:#3a0814;text-decoration:none;border-radius:999px;padding:12px 24px;font:700 15px Georgia,serif}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){:root{--d:.01}.hint{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Zarfı aç">
    <div class="back"></div>
    <div class="card" id="card">
      <div class="flip" id="flip">
        <img class="face fr" id="fr" alt="Kartpostalın ön yüzü">
        <img class="face bk" id="bk" alt="Kartpostalın arka yüzü">
      </div>
    </div>
    <div class="front"></div>
    <div class="crease"><i></i></div>
    <div class="flap"><b class="o"></b><b class="i"></b></div>
  </div>
  <div class="hint" id="hint">Yükleniyor…</div>
</div>
<div class="bar" id="bar">
  <div class="tip">Çevirmek için kartpostala dokunun ya da sürükleyin</div>
  <div class="btns">
    <a class="btn" id="dlOn" download="29-ekim-on-yuz.png">Ön yüzü indir</a>
    <a class="btn" id="dlBk" download="29-ekim-arka-yuz.png">Arka yüzü indir</a>
  </div>
</div>

<script>
(function(){
  var q=new URLSearchParams(location.search);
  var onSrc=q.get('on')||'29ekim_on.png', bkSrc=q.get('arka')||'29ekim_arka.png';
  var env=document.getElementById('env'), card=document.getElementById('card'),
      flip=document.getElementById('flip'), hint=document.getElementById('hint'),
      bar=document.getElementById('bar');
  var fr=document.getElementById('fr'), bk=document.getElementById('bk');
  document.getElementById('dlOn').href=onSrc;
  document.getElementById('dlBk').href=bkSrc;

  var need=3, ready=false;
  function ok(){ if(--need===0){ready=true;hint.textContent='Zarfa dokunun';} }
  function bad(){ hint.className='hint err'; hint.textContent='Görseller yüklenemedi. Dosyaların sayfayla aynı klasörde olduğundan emin olun.'; }
  fr.onload=bk.onload=ok; fr.onerror=bk.onerror=bad;
  var pre=new Image(); pre.onload=ok; pre.onerror=bad; pre.src='zarf_dis.png';
  fr.src=onSrc; bk.src=bkSrc;

  var started=false, done=false;
  function place(){
    var r=env.getBoundingClientRect(), cw=r.width*0.92, ch=cw*9/16;
    var cx=r.left+r.width*0.04+cw/2, cy=r.bottom-r.height*0.04-ch/2;
    var k=Math.min(innerWidth*0.94/cw,(innerHeight-120)/ch,2.6);
    card.style.transform='translate('+(innerWidth/2-cx)+'px,'+((innerHeight-70)/2-cy)+'px) scale('+k+')';
  }
  function open(){
    if(started||!ready) return; started=true;
    hint.classList.add('hide');
    env.classList.add('open');
    setTimeout(function(){env.classList.add('low');},450);
    setTimeout(function(){env.classList.add('rise');},850);
    setTimeout(function(){env.classList.add('out');place();},2200);
    setTimeout(function(){
      done=true; env.classList.add('done'); env.removeAttribute('role'); env.removeAttribute('tabindex');
      card.tabIndex=0; card.setAttribute('role','button'); card.setAttribute('aria-label','Kartpostalı çevir');
      bar.classList.add('show'); card.focus({preventScroll:true});
    },3400);
  }
  env.addEventListener('click',open);
  env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  addEventListener('resize',function(){if(done)place();});

  var rot=0,base=0,sx=0,drag=false,moved=false;
  function apply(){flip.style.transform='rotateY('+rot+'deg)';}
  flip.addEventListener('pointerdown',function(e){
    if(!done) return; drag=true; moved=false; sx=e.clientX; base=rot;
    flip.classList.add('drag'); flip.setPointerCapture(e.pointerId);
  });
  flip.addEventListener('pointermove',function(e){
    if(!drag) return; var dx=e.clientX-sx;
    if(Math.abs(dx)>4) moved=true;
    rot=base+dx*0.45; apply();
  });
  function end(){
    if(!drag) return; drag=false; flip.classList.remove('drag');
    rot = moved ? Math.round(rot/180)*180 : base+180; apply();
  }
  flip.addEventListener('pointerup',end);
  flip.addEventListener('pointercancel',end);
  card.addEventListener('keydown',function(e){
    if(!done) return;
    if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();rot+=180;apply();}
    if(e.key==='ArrowLeft'){e.preventDefault();rot-=180;apply();}
  });
})();
</script>
</body>
</html>
